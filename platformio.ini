; ess.io2 - ESP32 ESS gateway
; docs/11-architecture.md §10 참조

[platformio]
default_envs = esp32s3

[env]
build_flags =
    -std=gnu++17
    -Wall
    -DFW_VERSION=\"0.2.0-dev\"
build_unflags = -std=gnu++11

; 두 타겟이 공유하는 부분
[esp_common]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.0
    knolleary/PubSubClient @ ^2.8
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP @ ^3.3.0
    plerup/EspSoftwareSerial @ ^8.2.0
    mlesniew/PicoMQTT @ ^1.1.1

; 설계서 §2·§8의 실제 타겟: ESP32-S3 N16R8 (16MB flash, 8MB octal PSRAM)
; PSRAM이 GPIO 35/36/37을 점유하므로 그 핀은 쓰지 않는다 (docs/02-hardware.md).
[env:esp32s3]
extends = esp_common
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
build_flags =
    ${esp_common.build_flags}
    -DBOARD_HAS_PSRAM
    ; 네이티브 USB(USB-Serial-JTAG)로 로그를 보려면 1. 별도 UART 브리지 포트를 쓰는
    ; 보드라면 0으로 바꾼다 (Serial이 UART0으로 나간다).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; 구형 ESP32 보드 (초기 개발용)
[env:esp32dev]
extends = esp_common
platform = espressif32 @ ^6.9.0
board = esp32dev
board_build.partitions = partitions.csv
upload_speed = 921600

; 순수 C++ 로직(CRC, 프레임 파서, 스케일링) 단위 테스트용
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DNATIVE_TEST
