<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ess.io2</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; max-width: 40rem;
         background: #f4f4f5; color: #18181b; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #e5e5e5; } .card { background: #1c1c1e !important; } }
  h1 { font-size: 1.2rem; margin: 0 0 12px; }
  h2 { font-size: .9rem; margin: 0 0 8px; color: #71717a; font-weight: 600; }
  .card { background: #fff; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid rgba(128,128,128,.2); }
  .row:last-child { border-bottom: 0; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: .75rem; background: rgba(128,128,128,.25); }
  .on { background: #dcfce7; color: #166534; } .off { background: #fee2e2; color: #991b1b; }
  button, select { padding: 6px 10px; border: 1px solid rgba(128,128,128,.4); border-radius: 6px;
                   background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button.primary { background: #0d6b60; color: #fff; border-color: #0d6b60; }
  pre { font-size: .72rem; overflow-x: auto; margin: 8px 0 0; }
  .mode { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: .78rem; color: #71717a; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .grid .wide { grid-column: 1 / -1; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  label { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: #71717a; }
  label.check { flex-direction: row; align-items: center; gap: 6px; }
  input[type=text], input[type=password], input[type=number] {
    padding: 6px 8px; border: 1px solid rgba(128,128,128,.4); border-radius: 6px;
    background: transparent; color: inherit; font: inherit; font-size: .9rem; min-width: 0; }
  h3 { font-size: .82rem; margin: 14px 0 6px; }
  h3:first-of-type { margin-top: 4px; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .msg { font-size: .78rem; }
  .msg.err { color: #dc2626; }
  .feed { max-height: 22rem; overflow-y: auto; margin-top: 8px; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; }
  .feed .m { padding: 4px 0; border-bottom: 1px solid rgba(128,128,128,.15); }
  .feed .t { font-weight: 600; word-break: break-all; }
  .feed .p { color: #71717a; word-break: break-all; white-space: pre-wrap; }
  .feed .d { display: inline-block; min-width: 1.6rem; font-weight: 600; }
  .feed .tx { color: #0d6b60; } .feed .rx { color: #2563eb; } .feed .fail { color: #dc2626; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .toolbar input { flex: 1; min-width: 8rem; }
  #wizard { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-start;
            justify-content: center; padding: 16px; overflow-y: auto; z-index: 10; }
  #wizard[hidden] { display: none; }  /* 위의 display:flex가 hidden 속성을 덮지 않게 */
  #wizard .card { width: 100%; max-width: 34rem; margin-top: 4vh; }
  .choices { display: flex; flex-direction: column; gap: 6px; }
  .choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid rgba(128,128,128,.35);
            border-radius: 8px; cursor: pointer; }
  .choice input { margin-top: 3px; }
  .choice b { display: block; font-size: .9rem; }
  .choice span { font-size: .78rem; color: #71717a; }
  .choice.disabled { opacity: .45; cursor: not-allowed; }
  .steps { font-size: .75rem; color: #71717a; margin-bottom: 8px; }
  input[type=range] { width: 100%; }
  select.full { width: 100%; }
</style>
</head>
<body>
<h1>ess.io2 <span id="dev" class="badge"></span></h1>

<div id="wizard" hidden><div class="card" id="wizCard"></div></div>

<div class="card">
  <h2>동작 모드</h2>
  <div class="mode">
    <select id="mode"></select>
    <button class="primary" onclick="setMode()">적용</button>
  </div>
  <div class="hint" id="modeHint">브로커(MQTT 호스트)로 쓸지, 어느 장치의 클라이언트로 쓸지 고릅니다. 역할이 바뀌면 재부팅됩니다.</div>
</div>

<div class="card" id="sys">loading…</div>

<div class="card">
  <h2>MQTT 실시간</h2>
  <div id="mqttStatus">loading…</div>
  <div class="toolbar">
    <input type="text" id="feedFilter" placeholder="토픽 필터 (부분 일치)" oninput="renderFeed()">
    <button id="pauseBtn" onclick="togglePause()">일시정지</button>
    <button onclick="feed = []; renderFeed()">지우기</button>
  </div>
  <div class="feed" id="feed"></div>
</div>

<div id="slots"></div>

<div class="card">
  <h2>연결 설정</h2>
  <div id="settings">loading…</div>
</div>

<div class="card">
  <button onclick="post('/api/system/rediscover')">HA 재발행</button>
  <button onclick="post('/api/system/restart')">재부팅</button>
</div>

<script>
const $ = s => document.querySelector(s);
const H = { 'Content-Type': 'application/json', 'X-Requested-With': 'essio' };
let modesLoaded = false;
let role = null;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

async function api(p, o) { const r = await fetch(p, o); return r.json(); }
async function post(p, body) {
  const r = await api(p, { method: 'POST', headers: H, body: JSON.stringify(body || {}) });
  if (r.error) alert(r.error + ': ' + r.message);
  return r;
}

let modes = [];
async function loadModes() {
  const m = await api('/api/system/modes');
  modes = m.modes;
  $('#mode').innerHTML = m.modes.map(x =>
    `<option value="${x.id}" ${x.id === m.current ? 'selected' : ''} ${x.supported === false ? 'disabled' : ''}>${x.label}</option>`).join('');
  modesLoaded = true;
}

async function setMode() {
  const mode = $('#mode').value;
  // 디스플레이는 패널 설정을 받은 뒤 재부팅해야 하므로 마법사로 넘긴다
  if (mode === 'display') return openWizard('display');
  const r = await post('/api/system/mode', { mode });
  if (r.ok) {
    $('#modeHint').textContent = r.restart_required
      ? `${mode} 로 전환 중 — 재부팅합니다. 잠시 후 새로고침하세요.`
      : `${mode} 적용됨.`;
  }
}

async function toggle(slot, name, on) {
  await post(`/api/slots/${slot}/switch/${name}`, { on });
  setTimeout(refresh, 800);
}

async function refresh() {
  try {
    if (!modesLoaded) await loadModes();
    const sys = await api('/api/system/info');
    if (sys.configured === false && !wizardShown) openWizard();
    $('#dev').textContent = `${sys.device_id} · ${sys.mode}`;
    $('#sys').innerHTML = `<h2>상태</h2>
      <div class="row"><span>IP</span><span>${sys.ip || sys.ap_ip || '-'}</span></div>
      <div class="row"><span>WiFi</span><span>${sys.wifi_state} ${sys.rssi ? `(${sys.rssi} dBm)` : ''}</span></div>
      <div class="row"><span>역할</span><span>${sys.role}</span></div>
      <div class="row"><span>토픽 접두</span><span>${sys.base_topic || '-'}</span></div>
      <div class="row"><span>Heap</span><span>${sys.heap_free}</span></div>
      <div class="row"><span>Uptime</span><span>${sys.uptime_s}s</span></div>`;

    if (role !== sys.role) { role = sys.role; loadSettings(); }
    if (sys.role !== 'node') { $('#slots').innerHTML = ''; return; }

    const slots = await api('/api/slots');
    $('#slots').innerHTML = slots.filter(s => s.enabled).map(s => `
      <div class="card">
        <div class="row"><b>${s.label || s.slug}</b>
          <span class="badge ${s.online ? 'on' : 'off'}">${s.online ? 'online' : 'offline'}</span></div>
        ${(s.switches || []).map(w => `<div class="row"><span>${w.label}</span>
          <button onclick="toggle(${s.index}, '${w.name}', ${!w.on})" class="badge ${w.on ? 'on' : 'off'}">${w.on ? 'ON' : 'OFF'}</button></div>`).join('')}
        <pre>${JSON.stringify(s.state ?? {}, null, 1)}</pre>
        ${s.last_error ? `<div class="hint">last error: ${s.last_error}</div>` : ''}
      </div>`).join('') || '<div class="card">활성 슬롯 없음 (유휴 모드)</div>';
  } catch (e) { $('#sys').textContent = 'error: ' + e; }
}
// ---- MQTT 실시간 (GET /api/mqtt?since=) ----
const FEED_MAX = 200;
let feed = [], feedSince = 0, paused = false;
const row = (k, v) => `<div class="row"><span>${k}</span><span>${v}</span></div>`;
const dur = s => s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m` : s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
const RC = { '-4': '응답 없음', '-3': '연결 끊김', '-2': '접속 실패', '-1': '끊김', '1': '프로토콜 거부', '2': 'client id 거부', '3': '서버 불가', '4': '계정 오류', '5': '권한 없음' };

function togglePause() {
  paused = !paused;
  $('#pauseBtn').textContent = paused ? '재개' : '일시정지';
  if (!paused) renderFeed();
}

function renderFeed() {
  if (paused) return;
  const f = $('#feedFilter').value.trim();
  const rows = feed.filter(m => !f || m.topic.includes(f)).slice().reverse();
  $('#feed').innerHTML = rows.map(m => {
    const cut = m.size > m.payload.length ? ` … (${m.size} B)` : '';
    return `<div class="m"><span class="d ${m.failed ? 'fail' : m.dir}">${m.failed ? 'FAIL' : m.dir.toUpperCase()}</span>
      <span class="t">${esc(m.topic)}</span>${m.retain ? ' <span class="badge">retain</span>' : ''}
      <span class="hint" style="float:right">${new Date(m.at).toLocaleTimeString()}</span>
      <div class="p">${esc(m.payload)}${cut}</div></div>`;
  }).join('') || '<div class="hint">아직 메시지 없음</div>';
}

async function pollMqtt() {
  try {
    const r = await api('/api/mqtt?since=' + feedSince);
    if (r.next < feedSince) feed = [];  // 장치 재부팅으로 seq가 처음부터 다시 시작
    feedSince = r.next;
    const now = Date.now();
    for (const m of r.messages) { m.at = now; feed.push(m); }
    if (feed.length > FEED_MAX) feed.splice(0, feed.length - FEED_MAX);
    if (r.messages.length) renderFeed();

    if (r.broker) {
      const b = r.broker;
      const list = (b.client_list || []).map(c => `${esc(c.id)} <span class="hint">${dur(c.connected_s)}</span>`).join('<br>') || '-';
      $('#mqttStatus').innerHTML =
        row('브로커', `<span class="badge ${b.active ? 'on' : 'off'}">${b.active ? '수신 대기' : '중지'} :${b.port}</span>`) +
        row('접속 클라이언트', `${b.clients ?? 0}`) +
        row('클라이언트 목록', `<span style="text-align:right">${list}</span>`) +
        row('메시지 / retained', `${b.messages ?? 0} / ${b.retained ?? 0}`) +
        row('재생 / 거부 / 누락', `${b.replays ?? 0} / ${b.rejected ?? 0} / ${b.dropped ?? 0}`);
    } else if (r.client) {
      const c = r.client;
      const ok = c.state === 'connected';
      const src = { mdns: 'mDNS', gateway: '브로커 AP 게이트웨이', beacon: '브로커 비콘', last_good: '마지막 성공 주소', manual: '수동 입력', none: '-' }[c.address_source] || c.address_source;
      $('#mqttStatus').innerHTML =
        row('상태', `<span class="badge ${ok ? 'on' : 'off'}">${c.state}</span>${ok ? ` <span class="hint">${dur(c.connected_s)}</span>` : ''}`) +
        row('브로커', `${esc(c.broker || '-')}:${c.port} <span class="hint">(${src})</span>`) +
        (!ok && c.last_rc ? row('마지막 오류', `rc=${c.last_rc} ${RC[c.last_rc] || ''}`) : '') +
        row('client id', esc(c.client_id)) +
        row('토픽 접두', esc(c.base_topic || '-')) +
        row('발행 / 실패 / 수신', `${c.published} / ${c.failed} / ${c.received}`);
    }
  } catch (e) { $('#mqttStatus').textContent = 'error: ' + e; }
}

// ---- 최초 설정 마법사: 모드 → (디스플레이면 패널 설정) → Wi-Fi → 저장·재부팅 ----
// POST /api/system/mode {mode, config:{wifi, display}, restart:true} 한 번으로 끝낸다.
const PANELS = { crowpanel_2_1: 'Elecrow CrowPanel 2.1" 원형 480×480 (노브)' };
let wizardShown = false;
const wiz = { step: 0, mode: null, cfg: null };

async function openWizard(mode) {
  wizardShown = true;
  if (!modesLoaded) await loadModes();
  wiz.cfg = await api('/api/config');
  wiz.mode = mode || null;
  wiz.step = mode ? 1 : 0;
  $('#wizard').hidden = false;
  renderWizard();
}

function closeWizard() { $('#wizard').hidden = true; }

function wizSteps() { return ['모드', ...(wiz.mode === 'display' ? ['디스플레이'] : []), 'Wi-Fi', '확인']; }

function renderWizard() {
  const steps = wizSteps();
  const name = steps[wiz.step];
  const c = wiz.cfg;
  const head = `<div class="steps">${steps.map((x, i) => i === wiz.step ? `<b>${i + 1}. ${x}</b>` : `${i + 1}. ${x}`).join(' → ')}</div>`;
  let body = '', next = '다음';

  if (name === '모드') {
    const desc = { broker: '로컬 MQTT 호스트. 다른 보드들이 여기로 접속합니다.', display: '브로커에 붙어 모든 장치를 화면에 보이고 터치로 켜고 끕니다.', idle: '아무것도 하지 않습니다.' };
    body = `<h2>이 보드를 어디에 쓸까요?</h2><div class="choices">` + modes.map(m => {
      const off = m.supported === false;
      const d = desc[m.id] || `장치 클라이언트 — ${esc(m.label)} 를 폴링해 브로커로 보냅니다.`;
      return `<label class="choice ${off ? 'disabled' : ''}"><input type="radio" name="wm" value="${m.id}" ${wiz.mode === m.id ? 'checked' : ''} ${off ? 'disabled' : ''}>
        <div><b>${esc(m.label)}</b><span>${off ? '이 펌웨어 빌드에는 디스플레이 드라이버가 없습니다 (ESP32-S3 전용).' : d}</span></div></label>`;
    }).join('') + `</div>`;
  } else if (name === '디스플레이') {
    const d = c.display;
    body = `<h2>디스플레이 설정</h2><div class="grid">
      <label class="wide">패널<select class="full" id="wd_panel">${Object.entries(PANELS).map(([id, l]) =>
        `<option value="${id}" ${d.panel === id ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="wide">밝기 <span id="wd_bv">${d.brightness}%</span><input type="range" id="wd_bright" min="5" max="100" value="${d.brightness}" oninput="$('#wd_bv').textContent=this.value+'%'"></label>
      ${field('wd_dim', '입력 없으면 어둡게 (초, 0=안 함)', d.dim_after_s, 'number')}
      ${field('wd_dimb', '어둡게 할 때 밝기 (%)', d.dim_brightness, 'number')}
      ${field('wd_root', '구독할 토픽 루트', d.topic_root, 'text', ' class="wide"')}
    </div><div class="hint">패널은 재부팅 후에 켜집니다. 밝기·어둡게 설정은 나중에 "연결 설정"에서 바로 바꿀 수 있습니다.</div>`;
  } else if (name === 'Wi-Fi') {
    const w = c.wifi, broker = wiz.mode === 'broker';
    body = `<h2>Wi-Fi</h2><div class="grid">
      ${field('ww_ssid', '라우터 SSID (없으면 비움)', w.ssid)}
      ${field('ww_pass', '라우터 비밀번호', w.password, 'password')}
      ${field('ww_fssid', broker ? '라우터 없을 때 띄울 AP SSID' : '브로커 AP SSID (2순위)', w.fallback_ssid)}
      ${field('ww_fpass', broker ? '그 AP 비밀번호' : '브로커 AP 비밀번호', w.fallback_password, 'password')}
    </div><div class="hint">${broker ? '라우터가 보이면 라우터에, 없으면 스스로 AP를 띄웁니다.' : '라우터 → 브로커 AP 순서로 접속합니다. 둘 다 실패하면 설정용 AP(RV-SETUP-…)가 다시 켜집니다.'}</div>`;
  } else {
    const m = modes.find(x => x.id === wiz.mode);
    const w = wiz.wifi || {};
    body = `<h2>확인</h2>
      ${row('모드', esc(m ? m.label : wiz.mode))}
      ${wiz.display ? row('패널', esc(PANELS[wiz.display.panel] || wiz.display.panel)) + row('밝기', wiz.display.brightness + '%') : ''}
      ${row('라우터', esc(w.ssid || '(없음)'))}
      ${row(wiz.mode === 'broker' ? '폴백 AP' : '브로커 AP', esc(w.fallback_ssid || '-'))}
      <div class="hint">저장하면 재부팅합니다. 약 1분 뒤 보드가 접속한 망에서 다시 여세요. 접속에 실패하면 설정용 AP가 다시 켜집니다.</div>
      <div class="msg" id="wizMsg"></div>`;
    next = '저장하고 재부팅';
  }

  const back = wiz.step > 0 ? `<button onclick="wizBack()">이전</button>` : '';
  const later = `<button onclick="closeWizard()">나중에</button>`;
  $('#wizCard').innerHTML = head + body +
    `<div class="actions">${back}<button class="primary" id="wizNext" onclick="wizNext()">${next}</button>${later}</div>`;
}

function wizBack() { wizCollect(); wiz.step--; renderWizard(); }

function wizCollect() {
  const name = wizSteps()[wiz.step];
  if (name === '모드') {
    const r = document.querySelector('input[name=wm]:checked');
    wiz.mode = r ? r.value : null;
  } else if (name === '디스플레이') {
    wiz.display = { panel: val('wd_panel'), brightness: num('wd_bright'), dim_after_s: num('wd_dim'),
                    dim_brightness: num('wd_dimb'), topic_root: val('wd_root').trim() };
    wiz.cfg.display = { ...wiz.cfg.display, ...wiz.display };
  } else if (name === 'Wi-Fi') {
    wiz.wifi = { ssid: val('ww_ssid').trim(), password: val('ww_pass'),
                 fallback_ssid: val('ww_fssid').trim(), fallback_password: val('ww_fpass') };
    wiz.cfg.wifi = { ...wiz.cfg.wifi, ...wiz.wifi };
  }
}

async function wizNext() {
  wizCollect();
  const steps = wizSteps();
  if (steps[wiz.step] === '모드' && !wiz.mode) return;
  if (wiz.mode !== 'display') wiz.display = null;
  if (wiz.step < steps.length - 1) { wiz.step++; return renderWizard(); }

  const config = {};
  if (wiz.wifi) config.wifi = wiz.wifi;
  if (wiz.display) config.display = wiz.display;
  $('#wizNext').disabled = true;
  const r = await api('/api/system/mode', { method: 'POST', headers: H, body: JSON.stringify({ mode: wiz.mode, config, restart: true }) });
  if (r.error) {
    $('#wizMsg').className = 'msg err';
    $('#wizMsg').textContent = r.message || r.error;
    $('#wizNext').disabled = false;
    return;
  }
  $('#wizCard').innerHTML = `<h2>재부팅 중…</h2><div class="hint">설정을 저장했습니다. 약 1분 뒤 보드가 접속한 망에서 이 페이지를 다시 여세요.
    ${wiz.wifi && wiz.wifi.ssid ? `라우터 <b>${esc(wiz.wifi.ssid)}</b> 에서 IP를 확인하거나` : ''} 접속에 실패하면 설정용 AP로 다시 들어오면 됩니다.</div>`;
}

// ---- 연결 설정 (GET/PUT /api/config, 섹션 단위 부분 적용) ----
const MASK = '********';
const field = (id, label, value, type = 'text', extra = '') =>
  `<label${extra}>${label}<input type="${type}" id="${id}" value="${esc(value)}" autocomplete="off"></label>`;
const check = (id, label, on) => `<label class="check"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}>${label}</label>`;
const val = id => $('#' + id).value;
const num = id => parseInt(val(id), 10);

async function loadSettings() {
  const c = await api('/api/config');
  const w = c.wifi, m = c.mqtt, b = c.broker;
  const broker = c.device.role === 'broker';
  let h = `<h3>Wi-Fi</h3>
    <div class="grid">
      ${field('w_ssid', '라우터 SSID', w.ssid)}
      ${field('w_pass', '라우터 비밀번호', w.password, 'password')}
      ${field('w_fssid', broker ? '라우터 없을 때 띄울 AP SSID' : '2순위 SSID (브로커 AP)', w.fallback_ssid)}
      ${field('w_fpass', broker ? '그 AP 비밀번호' : '2순위 비밀번호', w.fallback_password, 'password')}
      ${field('w_appass', `설정용 AP 비밀번호 (RV-SETUP-…)`, w.ap.password, 'password')}
    </div>
    <div class="actions"><button class="primary" onclick="saveWifi()">Wi-Fi 저장</button><span class="msg" id="wifiMsg"></span></div>
    <div class="hint">저장하면 Wi-Fi가 다시 접속합니다. 지금 설정용 AP로 접속해 있다면 연결이 잠시 끊길 수 있습니다.</div>`;

  if (c.device.role === 'display') {
    const d = c.display;
    h += `<h3>디스플레이</h3>
      <div class="grid">
        <label class="wide">밝기 <span id="d_bv">${d.brightness}%</span><input type="range" id="d_bright" min="5" max="100" value="${d.brightness}" oninput="$('#d_bv').textContent=this.value+'%'"></label>
        ${field('d_dim', '입력 없으면 어둡게 (초, 0=안 함)', d.dim_after_s, 'number')}
        ${field('d_dimb', '어둡게 할 때 밝기 (%)', d.dim_brightness, 'number')}
      </div>
      <div class="actions"><button class="primary" onclick="saveDisplay()">디스플레이 저장</button><span class="msg" id="displayMsg"></span></div>
      <div class="hint">패널: ${esc(PANELS[d.panel] || d.panel)} · 토픽 루트 <code>${esc(d.topic_root)}</code>. 패널을 바꾸려면 동작 모드에서 디스플레이를 다시 고르세요.</div>`;
  }

  if (broker) {
    h += `<h3>내장 브로커</h3>
      <div class="grid">
        ${field('b_port', '수신 포트', b.port, 'number')}
        ${field('b_max', '최대 클라이언트 (1–16)', b.max_clients, 'number')}
        ${field('b_user', '사용자 (비우면 익명 허용)', b.username)}
        ${field('b_pass', '비밀번호', b.password, 'password')}
      </div>
      <div class="actions"><button class="primary" onclick="saveBroker()">브로커 저장</button><span class="msg" id="brokerMsg"></span></div>
      <div class="hint">저장하면 브로커가 다시 시작되어 접속 중인 클라이언트가 재접속합니다.</div>`;
  } else {
    h += `<h3>MQTT 브로커 접속</h3>
      <div class="grid">
        <div class="wide">${check('m_en', 'MQTT 사용', m.enabled)}</div>
        ${field('m_mdns', 'mDNS 이름 (.local 제외, 비우면 생략)', m.mdns_name)}
        ${field('m_host', '수동 주소 (IP 또는 호스트)', m.host)}
        ${field('m_port', '포트', m.port, 'number')}
        ${field('m_base', '토픽 접두 (비우면 자동)', m.base_topic)}
        ${field('m_user', '사용자', m.username)}
        ${field('m_pass', '비밀번호', m.password, 'password')}
        ${check('m_disc', 'HA Discovery 발행', m.discovery.enabled)}
        ${field('m_dpre', 'Discovery 접두', m.discovery.prefix)}
      </div>
      <div class="actions"><button class="primary" onclick="saveMqtt()">MQTT 저장</button><span class="msg" id="mqttMsg"></span></div>
      <div class="hint">주소는 mDNS → 마지막 성공 주소 → 수동 주소 순서로 찾습니다. 수동 주소만 쓰려면 mDNS 이름을 비우세요.</div>`;
  }
  $('#settings').innerHTML = h;
}

async function saveSection(msgId, patch) {
  const el = $('#' + msgId);
  el.className = 'msg'; el.textContent = '저장 중…';
  const r = await api('/api/config', { method: 'PUT', headers: H, body: JSON.stringify(patch) });
  if (r.error) { el.className = 'msg err'; el.textContent = r.message || r.error; return; }
  el.textContent = '저장됨 — 적용 중';
  setTimeout(() => { loadSettings().catch(() => {}); }, 1500);
}

function saveWifi() {
  saveSection('wifiMsg', { wifi: {
    ssid: val('w_ssid'), password: val('w_pass'),
    fallback_ssid: val('w_fssid'), fallback_password: val('w_fpass'),
    ap: { password: val('w_appass') } } });
}

function saveMqtt() {
  saveSection('mqttMsg', { mqtt: {
    enabled: $('#m_en').checked, mdns_name: val('m_mdns').trim(), host: val('m_host').trim(), port: num('m_port'),
    base_topic: val('m_base').trim(), username: val('m_user'), password: val('m_pass'),
    discovery: { enabled: $('#m_disc').checked, prefix: val('m_dpre').trim() } } });
}

function saveDisplay() {
  saveSection('displayMsg', { display: {
    brightness: num('d_bright'), dim_after_s: num('d_dim'), dim_brightness: num('d_dimb') } });
}

function saveBroker() {
  saveSection('brokerMsg', { broker: {
    port: num('b_port'), max_clients: num('b_max'), username: val('b_user'), password: val('b_pass') } });
}

refresh(); setInterval(refresh, 3000);
pollMqtt(); setInterval(pollMqtt, 1000);
</script>
</body>
</html>
